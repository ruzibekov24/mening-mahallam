name = "mahallam-downloads"
main = "index.js"
compatibility_date = "2026-08-20"

[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "mahallam-downloads"

# Hisoblagich uchun Durable Object — KV'dan farqli o'laroq har bir
# obyekt bitta oqimda ishlaydi, shuning uchun bir vaqtda kelgan
# yuklashlar bir-birining hisobini o'chirib yubormaydi.
[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]
